[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orquestador"
version = "0.1.0"
description = "Asistente de Red Inteligente (NetDevOps + LLM)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "google-auth>=2.37",
    "langchain-google-genai>=2.0",
    "langchain-core>=0.3",
    "python-multipart>=0.0.18",
    "jinja2>=3.1",
    "cachetools>=5.5",
    "itsdangerous>=2.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]
