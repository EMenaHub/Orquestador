<label>Región</label>
<select name="region"
        hx-get="/api/devices"
        hx-target="#device-select"
        hx-trigger="change"
        hx-indicator="#region-spinner">
    <option value="">Seleccionar región</option>
    {% for r in regions %}
    <option value="{{ r.id }}">{{ r.name }}</option>
    {% endfor %}
</select>
<div id="region-spinner" class="htmx-indicator">Cargando dispositivos...</div>
