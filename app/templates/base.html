<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orquestador</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/htmx-ext-sse@2.0.0/sse.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

    <div class="ambient-bg" aria-hidden="true">
        <div class="ambient-blob ambient-blob--primary"></div>
        <div class="ambient-blob ambient-blob--secondary"></div>
        <div class="ambient-blob ambient-blob--tertiary"></div>
        <div class="ambient-blob ambient-blob--bottom"></div>
        <div class="ambient-grid"></div>
        <svg class="ambient-noise" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
            <filter id="noise">
                <feTurbulence type="fractalNoise" baseFrequency="0.4" numOctaves="3" stitchTiles="stitch"/>
                <feComponentTransfer>
                    <feFuncA type="linear" slope="0.015"/>
                </feComponentTransfer>
            </filter>
            <rect width="100%" height="100%" filter="url(#noise)"/>
        </svg>
    </div>

    {% block content %}{% endblock %}

</body>
</html>
